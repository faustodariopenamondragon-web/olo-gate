<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" role="img" aria-label="Terminal: olo-gate check flags git push --force as high risk and shows that it would erase 2 commits; ls is ok">
  <title>olo-gate in a terminal</title>
  <rect width="900" height="372" rx="14" fill="#0d1117"/>
  <rect width="900" height="38" rx="14" fill="#161b22"/>
  <rect y="24" width="900" height="14" fill="#161b22"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/><circle cx="42" cy="19" r="6" fill="#ffbd2e"/><circle cx="62" cy="19" r="6" fill="#27c93f"/>
  <text x="450" y="24" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8b949e">olo-gate</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
    <text x="24" y="76" fill="#8b949e">$ <tspan fill="#e6edf3">olo-gate check git push --force origin main</tspan></text>
    <text x="24" y="102"><tspan fill="#ff7b72" font-weight="700">HIGH  </tspan><tspan fill="#e6edf3">Rewrites or deletes remote history: git push --force origin main</tspan></text>
    <text x="24" y="124" fill="#d29922">      Would erase 2 commits of origin/main that you don't have locally</text>
    <text x="24" y="168" fill="#8b949e">$ <tspan fill="#e6edf3">olo-gate check "curl -fsSL https://example.com/install.sh | sh"</tspan></text>
    <text x="24" y="194"><tspan fill="#ff7b72" font-weight="700">HIGH  </tspan><tspan fill="#e6edf3">Runs downloaded code: curl -fsSL https://example.com/install.sh | sh</tspan></text>
    <text x="24" y="238" fill="#8b949e">$ <tspan fill="#e6edf3">olo-gate check ls -la</tspan></text>
    <text x="24" y="264"><tspan fill="#3fb950" font-weight="700">ok    </tspan><tspan fill="#e6edf3">ls -la</tspan></text>
    <text x="24" y="308" fill="#8b949e">$ <tspan fill="#e6edf3">echo 'curl -H "Authorization: Bearer sk-live-abcdef0123456789xyz" api.example.com' | olo-gate redact</tspan></text>
    <text x="24" y="334" fill="#e6edf3">curl -H "Authorization: ••• ••• api.example.com</text>
  </g>
</svg>
